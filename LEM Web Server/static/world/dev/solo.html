<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LEM world — solo harness</title>
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden}
  #world{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:10px;top:10px;font:11px/1.5 ui-monospace,monospace;
       color:#9fb0c6;background:rgba(6,9,13,.72);padding:8px 11px;border-radius:8px;
       border:1px solid #222c3a;white-space:pre;pointer-events:none;z-index:5}
  #err{position:fixed;left:10px;bottom:10px;right:10px;max-height:38vh;overflow:auto;
       font:11px/1.5 ui-monospace,monospace;color:#ff9a9a;
       background:rgba(30,8,8,.85);padding:8px 11px;border-radius:8px;display:none;
       z-index:6}
</style>
</head>
<body>
<!--
  The solo harness. One subsystem, or a few, with no Flask, no LabCore and no
  page around it — so a change to the terrain can be looked at in three seconds
  instead of booting the lab. It renders the same fixture fleet every time, so
  two screenshots taken a week apart are actually comparable.

    dev/solo.html?mods=terrain,buildings&time=17.5&weather=rain&cam=low
-->
<canvas id="world"></canvas>
<div id="hud">booting…</div>
<pre id="err"></pre>
<script type="importmap">
{"imports": {
  "three": "../../vendor/three.module.min.js",
  "world/engine.js": "../engine.js",
  "world/camera.js": "../camera.js",
  "world/textures.js": "../textures.js",
  "world/index.js": "../index.js",
  "world/sky.js": "../sky.js",
  "world/gi.js": "../gi.js",
  "world/terrain.js": "../terrain.js",
  "world/buildings.js": "../buildings.js",
  "world/rail.js": "../rail.js",
  "world/trains.js": "../trains.js",
  "world/vegetation.js": "../vegetation.js",
  "world/props.js": "../props.js",
  "world/weather.js": "../weather.js",
  "world/labels.js": "../labels.js"
}}
</script>
<script type="module">
import {LEMWorld} from 'world/index.js';

const q = new URLSearchParams(location.search);
const errBox = document.getElementById('err');
const say = msg => {
  errBox.style.display = 'block';
  errBox.textContent += msg + '\n';
};
window.addEventListener('error', e => say('ERROR ' + e.message));
window.addEventListener('unhandledrejection', e => say('REJECTED ' + e.reason));
const realError = console.error;
console.error = (...a) => { realError(...a); say(a.map(String).join(' ')); };

/* The same seven instruments the lab actually has, with every status the floor
 * can paint. Deterministic on purpose. */
const FLEET = [
  ['multitek-ns', 'Multitek NS', 'GREEN',     [0, 0],       ['GREEN','GREEN','GREEN']],
  ['multitek-s',  'Multitek S',  'YELLOW',    [2.05, 0],    ['YELLOW','GREEN','UNKNOWN']],
  ['optimpp-1',   'OptiMPP 1',   'GREEN',     [4.10, 0],    ['GREEN','GREEN','YELLOW']],
  ['optimpp-2',   'OptiMPP 2',   'RED',       [0, 2.05],    ['RED','GREEN','GREEN']],
  ['pac-flash-1', 'PAC Flash 1', 'SERVICE',   [2.05, 2.05], ['UNKNOWN','RED','GREEN']],
  ['pac-flash-2', 'PAC Flash 2', 'DEAD-LINE', [4.10, 2.05], ['RED','RED','RED']],
  ['koehler-cp',  'Koehler CP',  'UNKNOWN',   [6.15, 0],    ['UNKNOWN','UNKNOWN','UNKNOWN']],
].map(([uid, title, status, pos, [qc, pm, cal]]) => ({
  machine_uid: uid, title, status, pos, reason: 'Fixture.',
  sub_statuses: {qc, pm, calibration: cal},
  module_running: uid !== 'koehler-cp', module_state:
    uid === 'koehler-cp' ? 'stopped' : 'running',
  effective_specs: [], qc_targets: [], maintenance: [],
}));

const mods = (q.get('mods') || '').trim();
const world = new LEMWorld(document.getElementById('world'), {
  only: mods ? mods.split(',').map(s => s.trim()).filter(Boolean) : undefined,
  autoQuality: q.get('auto') === '1',
  canDrag: () => true,
  onSelect: uid => console.log('select', uid),
});
window.__lemWorld = world;   // NOT window.world: <canvas id="world"> already owns that

world.setMachines(FLEET);
if (q.has('time')) world.setTimeOfDay(parseFloat(q.get('time')));
await world.ready();
if (q.has('time')) world.setTimeOfDay(parseFloat(q.get('time')));
if (q.has('weather')) {
  const presets = {
    clear:    {preset: 'clear',    rain: 0,   wetness: 0,    cloud: 0.15, fog: 0.10},
    overcast: {preset: 'overcast', rain: 0,   wetness: 0.25, cloud: 0.85, fog: 0.30},
    rain:     {preset: 'rain',     rain: 0.8, wetness: 0.9,  cloud: 0.95, fog: 0.45},
    storm:    {preset: 'storm',    rain: 1.0, wetness: 1.0,  cloud: 1.0,  fog: 0.6,
               wind: 0.9},
    snow:     {preset: 'snow',     snow: 0.8, wetness: 0.4,  cloud: 0.9,  fog: 0.5,
               temperature: -4},
    fog:      {preset: 'fog',      rain: 0,   wetness: 0.35, cloud: 0.6,  fog: 0.9},
  };
  world.setWeather(presets[q.get('weather')] || presets.clear);
}

/* Camera presets, so a screenshot from one run frames the same thing as the
 * screenshot it is being compared against. */
const CAMS = {
  wide:   {yaw: -0.7,  pitch: 0.46, distance: 340},
  /* `far` was used for every one of the first twenty-nine blind comparisons
     before anybody noticed it was not in this table. An unknown name leaves
     `cam` undefined, `if (cam)` false, and the rig at its own defaults — which
     happen to be wide's yaw and pitch at distance 900. So the frames were
     consistent and were genuinely the far view they were labelled as, and no
     result was invalidated. But they depended on an undeclared default: change
     the rig's initial distance and every judged frame in the project silently
     re-frames. Declared here at the exact values those comparisons used, so the
     history stays comparable and the dependency is visible. */
  far:    {yaw: -0.7,  pitch: 0.46, distance: 900},
  low:    {yaw: -1.15, pitch: 0.13, distance: 130},
  /* The sun sweeps azimuth +97 to -83 across the working day, and this
     preset's view azimuth is fixed — at yaw 0.55 it sat 172 degrees from
     the sun at 10:00, i.e. directly behind the viewer, so the one camera
     most likely to be used for judging track detail never showed a ground
     shadow at any hour. Turned side-on to the light. */
  street: {yaw: 1.95,  pitch: 0.06, distance: 62},
  yard:   {yaw: 2.2,   pitch: 0.20, distance: 105},
  top:    {yaw: -0.7,  pitch: 1.20, distance: 420},
};
const cam = CAMS[q.get('cam') || 'wide'];
if (cam) {
  Object.assign(world.rig, {goalYaw: cam.yaw, goalPitch: cam.pitch,
                            goalDistance: cam.distance});
  if (q.get('at')) {
    const s = world.plan?.byUid.get(q.get('at'));
    if (s) world.rig.goalTarget.set(s.x, 4, s.z);
  }
  world.rig.apply(1);
  world.rig.idleDrift = false;
}

/* The HUD is burned into any screenshot taken of this page, which makes our
 * frames instantly identifiable in a blind comparison — a critic in round one
 * spotted it and said so. `hud=0` turns it off for judged shots; the numbers
 * are in the harness sidecar JSON anyway. */
/* Pin the quality for this page load only.
 *
 * The adaptive ladder now probes from the floor tier upward, which is right for
 * a bench PC meeting the world cold — but it means a short capture renders at
 * the lowest tier and a judged screenshot would show the worst the renderer can
 * do. `?quality=ultra` fixes the tier without touching the stored preference,
 * so a harness run cannot silently change what the operator's own screen does
 * next time they open it. */
/* Season, so a harness run can ask for autumn without waiting for October. */
if (q.has('season')) world.setSeason(q.get('season'));

const wantQ = q.get('quality');
if (wantQ) {
  const idx = world.engine.constructor === Object ? -1
    : (await import('world/engine.js')).TIERS.findIndex(t => t.name === wantQ);
  if (idx >= 0) {
    world.engine.autoQuality = false;
    world.engine.probing = false;
    world.engine.setTier(idx, {force: true});
  }
}

const hud = document.getElementById('hud');
if (q.get('hud') === '0') hud.style.display = 'none';
setInterval(() => {
  if (q.get('hud') === '0') return;
  const s = world.stats();
  hud.textContent =
    `${s.fps} fps · ${s.tier}\n${s.drawCalls} draws · ` +
    `${(s.triangles / 1000).toFixed(1)}k tris\n` +
    `mods: ${[...world.subsystems.keys()].join(' ') || '(none)'}` +
    (world.failed.length ? `\nFAILED: ${world.failed.join(' ')}` : '');
}, 250);

/* A parse every two seconds, so trains are always on the road. */
setInterval(() => {
  const s = FLEET[Math.floor(Math.random() * FLEET.length)];
  world.parse(s.machine_uid, 'L-' + (1000 + Math.floor(Math.random() * 9000)));
}, 2000);

window.__worldReady = true;
</script>
</body>
</html>
